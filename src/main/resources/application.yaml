spring:
  application:
    name: semiproject-polink

  # Git에 올리지 않는 개인 설정 파일이 있으면 함께 읽는다.
  # 파일이 없어도(optional) 애플리케이션은 시작할 수 있다.
  config:
    import: optional:classpath:application-local.yaml

  # MySQL 연결 설정
  datasource:
    url: jdbc:mysql://localhost:3306/polink?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:polink}
    password: ${DB_PASSWORD:polink}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 테이블은 sql/01_DB_SCRIPT.sql에서 직접 생성한다.
  # validate: Java Entity와 실제 MySQL 테이블의 구조가 다르면 실행 시 알려 준다.
  jpa:
    # 개발 중 실행되는 SQL을 콘솔에 표시한다.
    # 실제 배포 환경에서는 false 또는 제거한다.
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
